<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>서현의 아기 돼지</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(180deg, #fde8f5 0%, #fce4f0 40%, #f9d4ea 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
      user-select: none;
    }

    header {
      margin-top: 28px;
      text-align: center;
    }
    header h1 {
      font-size: 2rem;
      color: #d4679a;
      text-shadow: 0 2px 12px rgba(212,103,154,0.18);
      letter-spacing: -0.01em;
    }
    header p {
      color: #e89bc0;
      font-size: 0.95rem;
      margin-top: 4px;
    }

    /* ── 상태창 ── */
    .status-panel {
      background: rgba(255,255,255,0.88);
      border-radius: 20px;
      padding: 14px 28px;
      margin-top: 18px;
      display: flex;
      gap: 28px;
      box-shadow: 0 4px 20px rgba(212,103,154,0.12);
      align-items: center;
    }
    .stat-item { display: flex; flex-direction: column; align-items: center; gap: 5px; }
    .stat-label { font-size: 0.78rem; color: #c0829e; font-weight: 700; letter-spacing: 0.04em; }
    .bar-wrap { width: 110px; height: 13px; background: #fce4f0; border-radius: 99px; overflow: hidden; }
    .bar { height: 100%; border-radius: 99px; transition: width 0.5s ease; }
    .bar.hunger  { background: linear-gradient(90deg, #f97316, #fbbf24); }
    .bar.happy   { background: linear-gradient(90deg, #ec4899, #f472b6); }
    .mood-text { font-size: 1.1rem; font-weight: 700; color: #374151; }

    /* ── 메인 영역 ── */
    .main-area {
      position: relative;
      width: 520px;
      height: 360px;
      margin-top: 4px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    /* ── 먹이 트레이 ── */
    .food-tray {
      position: absolute;
      left: 0;
      bottom: 60px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .food-item {
      font-size: 2.2rem;
      cursor: grab;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.12));
      transition: transform 0.15s;
      width: 52px;
      text-align: center;
    }
    .food-item:hover { transform: scale(1.25) rotate(-5deg); }
    .food-item:active { cursor: grabbing; }
    .food-item.dragging { opacity: 0.35; }

    /* ── 돼지 컨테이너 ── */
    .pig-container {
      position: relative;
      width: 230px;
      height: 290px;
      cursor: pointer;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      flex-shrink: 0;
    }

    /* ── SVG 돼지 스케일 호버 ── */
    #pig-svg {
      transition: transform 0.22s cubic-bezier(.34,1.56,.64,1);
      transform-origin: bottom center;
      overflow: visible;
    }
    .pig-container:hover #pig-svg { transform: scale(1.06); }
    .pig-container.dragover #pig-svg {
      filter: drop-shadow(0 0 14px #fbbf24) drop-shadow(0 0 6px #f97316);
    }

    /* ── 말풍선 ── */
    .speech-bubble {
      position: absolute;
      top: 0px;
      left: 50%;
      transform: translateX(-50%);
      background: #fff;
      border-radius: 14px;
      padding: 7px 16px;
      font-size: 1rem;
      font-weight: 700;
      color: #374151;
      box-shadow: 0 3px 14px rgba(0,0,0,0.10);
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      border: 5px solid transparent;
      border-top-color: #fff;
    }
    .speech-bubble.visible { opacity: 1; }

    /* ── SVG 돼지 애니메이션 ── */
    #pigHead {
      transform-origin: 110px 108px;
    }
    @keyframes bounce {
      0%,100% { transform: translateY(0); }
      30%      { transform: translateY(-24px); }
      65%      { transform: translateY(-10px); }
    }
    @keyframes wiggle {
      0%,100% { transform: rotate(0deg); }
      20%      { transform: rotate(-8deg); }
      60%      { transform: rotate(8deg); }
    }
    #pigHead.bouncing { animation: bounce 0.52s cubic-bezier(.36,.07,.19,.97); }
    #pigHead.wiggling { animation: wiggle 0.38s ease 3; }

    /* ── ZZZ 애니메이션 ── */
    @keyframes zzz {
      0%,100% { opacity: 0; transform: translate(0,0) scale(0.6); }
      50%      { opacity: 1; transform: translate(7px,-14px) scale(1); }
    }
    #zzz { animation: zzz 2.2s ease-in-out infinite; transform-origin: 158px 58px; }

    /* ── 수면 눈 ── */
    .eye-awake { }
    .eye-sleep  { display: none; }
    #eyeL.sleeping .eye-awake,
    #eyeR.sleeping .eye-awake { display: none; }
    #eyeL.sleeping .eye-sleep,
    #eyeR.sleeping .eye-sleep { display: block; }

    /* ── 파티클 ── */
    .particle {
      position: fixed;
      pointer-events: none;
      font-size: 1.5rem;
      animation: floatUp 1.3s ease-out forwards;
      z-index: 100;
    }
    @keyframes floatUp {
      0%   { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-100px) scale(0.4); }
    }

    /* ── 버튼 ── */
    .btn-row {
      display: flex;
      gap: 16px;
      margin-top: 16px;
    }
    .btn {
      padding: 12px 28px;
      border: none;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,0.10);
      transition: transform 0.12s, box-shadow 0.12s;
    }
    .btn:hover  { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.13); }
    .btn:active { transform: translateY(1px); }
    .btn.pet  { background: linear-gradient(135deg, #f9a8d4, #ec4899); color: #fff; }
    .btn.feed { background: linear-gradient(135deg, #fde68a, #f97316); color: #fff; }

    /* ── 힌트 ── */
    .drag-hint {
      font-size: 0.82rem;
      color: rgba(180,100,140,0.85);
      margin-top: 8px;
      text-align: center;
    }

    footer {
      margin-top: auto;
      padding: 22px;
      color: rgba(200,120,160,0.7);
      font-size: 0.82rem;
      text-align: center;
    }

    /* 드래그 고스트 */
    #drag-ghost {
      position: fixed;
      pointer-events: none;
      font-size: 2.2rem;
      z-index: 999;
      transform: translate(-50%, -50%);
      display: none;
    }
  </style>
</head>
<body>

<header>
  <h1>🩷 서현의 아기 돼지</h1>
  <p>돼지와 놀아주세요!</p>
</header>

<!-- B: 상태창 -->
<div class="status-panel">
  <div class="stat-item">
    <span class="stat-label">🍎 배고픔</span>
    <div class="bar-wrap"><div class="bar hunger" id="hungerBar" style="width:80%"></div></div>
  </div>
  <div class="stat-item">
    <span class="stat-label">💕 행복도</span>
    <div class="bar-wrap"><div class="bar happy" id="happyBar" style="width:75%"></div></div>
  </div>
  <div class="stat-item">
    <span class="mood-text" id="moodText">😊 보통</span>
  </div>
</div>

<div class="main-area">
  <!-- D: 먹이 트레이 -->
  <div class="food-tray">
    <div class="food-item" draggable="true" data-food="🍎" title="사과">🍎</div>
    <div class="food-item" draggable="true" data-food="🥕" title="당근">🥕</div>
    <div class="food-item" draggable="true" data-food="🌽" title="옥수수">🌽</div>
  </div>

  <!-- 돼지 -->
  <div class="pig-container" id="pigContainer">
    <div class="speech-bubble" id="speechBubble">꿀꿀!</div>

    <!-- ══ 카와이 SVG 아기 돼지 ══ -->
    <svg id="pig-svg" viewBox="0 0 220 260" xmlns="http://www.w3.org/2000/svg"
         width="220" height="260" style="overflow:visible;">
      <defs>
        <filter id="softShadow" x="-20%" y="-10%" width="140%" height="140%">
          <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#e07aaf" flood-opacity="0.22"/>
        </filter>
        <radialGradient id="bodyGrad" cx="38%" cy="35%" r="65%">
          <stop offset="0%"   stop-color="#ffd6ea"/>
          <stop offset="100%" stop-color="#ffb3d1"/>
        </radialGradient>
        <radialGradient id="headGrad" cx="35%" cy="30%" r="65%">
          <stop offset="0%"   stop-color="#ffdaed"/>
          <stop offset="100%" stop-color="#ffb3d1"/>
        </radialGradient>
      </defs>

      <!-- ── 왼쪽 귀 ── -->
      <ellipse cx="60" cy="50" rx="26" ry="34" fill="#ffb3d1" stroke="#de87b8" stroke-width="3.5"
               transform="rotate(-18,60,50)" filter="url(#softShadow)"/>
      <ellipse cx="60" cy="48" rx="14" ry="21" fill="#f093bf" transform="rotate(-18,60,48)"/>
      <!-- 귀 안쪽 하이라이트 -->
      <ellipse cx="55" cy="41" rx="5" ry="8" fill="rgba(255,255,255,0.28)" transform="rotate(-18,55,41)"/>

      <!-- ── 오른쪽 귀 ── -->
      <ellipse cx="160" cy="50" rx="26" ry="34" fill="#ffb3d1" stroke="#de87b8" stroke-width="3.5"
               transform="rotate(18,160,50)" filter="url(#softShadow)"/>
      <ellipse cx="160" cy="48" rx="14" ry="21" fill="#f093bf" transform="rotate(18,160,48)"/>
      <ellipse cx="165" cy="41" rx="5" ry="8" fill="rgba(255,255,255,0.28)" transform="rotate(18,165,41)"/>

      <!-- ── 몸통 ── -->
      <ellipse cx="110" cy="200" rx="70" ry="58" fill="url(#bodyGrad)" stroke="#de87b8" stroke-width="3.5"
               filter="url(#softShadow)"/>
      <!-- 몸통 하이라이트 -->
      <ellipse cx="85" cy="172" rx="22" ry="14" fill="rgba(255,255,255,0.32)" transform="rotate(-22,85,172)"/>

      <!-- ── 왼팔 ── -->
      <ellipse cx="43" cy="205" rx="22" ry="16" fill="#ffb3d1" stroke="#de87b8" stroke-width="3"
               transform="rotate(-28,43,205)"/>
      <!-- 왼손 발굽 -->
      <ellipse cx="34" cy="219" rx="16" ry="11" fill="#ffd0e8" stroke="#de87b8" stroke-width="2.5"/>

      <!-- ── 오른팔 ── -->
      <ellipse cx="177" cy="205" rx="22" ry="16" fill="#ffb3d1" stroke="#de87b8" stroke-width="3"
               transform="rotate(28,177,205)"/>
      <!-- 오른손 발굽 -->
      <ellipse cx="186" cy="219" rx="16" ry="11" fill="#ffd0e8" stroke="#de87b8" stroke-width="2.5"/>

      <!-- ── 왼다리 발굽 ── -->
      <ellipse cx="80" cy="248" rx="21" ry="14" fill="#ffb3d1" stroke="#de87b8" stroke-width="2.5"/>
      <ellipse cx="80" cy="251" rx="17" ry="10" fill="#ffd0e8" stroke="#de87b8" stroke-width="2"/>

      <!-- ── 오른다리 발굽 ── -->
      <ellipse cx="140" cy="248" rx="21" ry="14" fill="#ffb3d1" stroke="#de87b8" stroke-width="2.5"/>
      <ellipse cx="140" cy="251" rx="17" ry="10" fill="#ffd0e8" stroke="#de87b8" stroke-width="2"/>

      <!-- ══ 머리 그룹 (바운스/위글 애니메이션 대상) ══ -->
      <g id="pigHead">

        <!-- 머리 원 -->
        <circle cx="110" cy="108" r="72" fill="url(#headGrad)" stroke="#de87b8" stroke-width="3.5"
                filter="url(#softShadow)"/>
        <!-- 머리 하이라이트 -->
        <ellipse cx="83" cy="66" rx="24" ry="16" fill="rgba(255,255,255,0.36)" transform="rotate(-28,83,66)"/>

        <!-- ── 볼 터치 ── -->
        <ellipse cx="62" cy="120" rx="26" ry="17" fill="rgba(230,100,148,0.26)"/>
        <ellipse cx="158" cy="120" rx="26" ry="17" fill="rgba(230,100,148,0.26)"/>

        <!-- ── 코 (크고 둥근 주둥이) ── -->
        <ellipse cx="110" cy="132" rx="40" ry="30" fill="#ffdae9" stroke="#de87b8" stroke-width="2.5"/>
        <!-- 코 하이라이트 -->
        <ellipse cx="97" cy="122" rx="10" ry="7" fill="rgba(255,255,255,0.55)" transform="rotate(-12,97,122)"/>
        <!-- 콧구멍 -->
        <ellipse cx="97"  cy="137" rx="9" ry="8" fill="#d96da0"/>
        <ellipse cx="123" cy="137" rx="9" ry="8" fill="#d96da0"/>
        <!-- 콧구멍 하이라이트 -->
        <ellipse cx="94"  cy="134" rx="3.5" ry="2.5" fill="rgba(255,255,255,0.4)"/>
        <ellipse cx="120" cy="134" rx="3.5" ry="2.5" fill="rgba(255,255,255,0.4)"/>

        <!-- ── 왼쪽 눈 ── -->
        <g id="eyeL">
          <!-- 깨어있는 눈 -->
          <g class="eye-awake">
            <circle cx="84" cy="96" r="10" fill="#3b1a28"/>
            <!-- 졸린 눈꺼풀 (위 절반 가리기) -->
            <path d="M74,96 Q84,82 94,96" fill="#ffdaed"/>
            <!-- 눈꺼풀 라인 -->
            <path d="M74,96 Q84,83 94,96" fill="none" stroke="#3b1a28" stroke-width="2.2" stroke-linecap="round"/>
            <!-- 눈 하이라이트 -->
            <circle id="pupilL" cx="81" cy="100" r="3.5" fill="white" opacity="0.88"/>
            <circle cx="88" cy="97" r="1.5" fill="white" opacity="0.5"/>
          </g>
          <!-- 수면 눈 -->
          <g class="eye-sleep">
            <path d="M74,96 Q84,103 94,96" fill="none" stroke="#d96da0" stroke-width="3" stroke-linecap="round"/>
          </g>
        </g>

        <!-- ── 오른쪽 눈 ── -->
        <g id="eyeR">
          <!-- 깨어있는 눈 -->
          <g class="eye-awake">
            <circle cx="136" cy="96" r="10" fill="#3b1a28"/>
            <path d="M126,96 Q136,82 146,96" fill="#ffdaed"/>
            <path d="M126,96 Q136,83 146,96" fill="none" stroke="#3b1a28" stroke-width="2.2" stroke-linecap="round"/>
            <circle id="pupilR" cx="133" cy="100" r="3.5" fill="white" opacity="0.88"/>
            <circle cx="140" cy="97" r="1.5" fill="white" opacity="0.5"/>
          </g>
          <!-- 수면 눈 -->
          <g class="eye-sleep">
            <path d="M126,96 Q136,103 146,96" fill="none" stroke="#d96da0" stroke-width="3" stroke-linecap="round"/>
          </g>
        </g>

        <!-- ── 입 ── -->
        <path id="mouth" d="M101,155 Q110,164 119,155"
              fill="none" stroke="#d96da0" stroke-width="3" stroke-linecap="round"/>

        <!-- ── ZZZ (수면용) ── -->
        <text id="zzz" x="158" y="62" font-size="17" fill="#d96da0"
              opacity="0" font-family="system-ui" font-weight="700">💤</text>

      </g><!-- /pigHead -->

      <!-- ── 반짝이 장식 ── -->
      <g fill="white" opacity="0.85">
        <path d="M198 68 l2.5 -6 2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5z"/>
        <path d="M16 95 l1.8 -4.5 1.8 4.5 4.5 1.8 -4.5 1.8 -1.8 4.5 -1.8 -4.5 -4.5 -1.8z" opacity="0.7"/>
        <path d="M195 195 l1.5 -3.5 1.5 3.5 3.5 1.5 -3.5 1.5 -1.5 3.5 -1.5 -3.5 -3.5 -1.5z" opacity="0.6"/>
      </g>
    </svg>
    <!-- /SVG pig -->

  </div><!-- /pig-container -->
</div><!-- /main-area -->

<p class="drag-hint">← 먹이를 끌어다 돼지에게 주세요!</p>

<div class="btn-row">
  <button class="btn pet"  id="btnPet">🤚 쓰다듬기</button>
  <button class="btn feed" id="btnFeed">🍎 먹이주기</button>
</div>

<div id="drag-ghost"></div>

<footer>🩷 서현의 아기 돼지 · 2026</footer>

<script>
  // ── 상태 ──
  const state = {
    hunger: 80,
    happy:  75,
    sleeping: false,
    idleTimer: null,
  };

  const hungerBar    = document.getElementById('hungerBar');
  const happyBar     = document.getElementById('happyBar');
  const moodText     = document.getElementById('moodText');
  const speechBubble = document.getElementById('speechBubble');
  const pigHead      = document.getElementById('pigHead');
  const pigContainer = document.getElementById('pigContainer');
  const eyeL         = document.getElementById('eyeL');
  const eyeR         = document.getElementById('eyeR');
  const pupilL       = document.getElementById('pupilL');
  const pupilR       = document.getElementById('pupilR');
  const mouth        = document.getElementById('mouth');
  const zzz          = document.getElementById('zzz');

  // ── B: 상태 업데이트 ──
  function updateStatus() {
    hungerBar.style.width = state.hunger + '%';
    happyBar.style.width  = state.happy  + '%';

    if (state.sleeping) {
      moodText.textContent = '😴 자는 중';
      return;
    }
    if (state.hunger < 25) {
      moodText.textContent = '😢 배고파요!';
      mouth.setAttribute('d', 'M101,155 Q110,147 119,155');
    } else if (state.happy > 85) {
      moodText.textContent = '😍 행복해요!';
      mouth.setAttribute('d', 'M97,152 Q110,168 123,152');
    } else if (state.happy < 30) {
      moodText.textContent = '😞 외로워요';
      mouth.setAttribute('d', 'M101,155 Q110,147 119,155');
    } else {
      moodText.textContent = '😊 보통';
      mouth.setAttribute('d', 'M101,155 Q110,164 119,155');
    }
  }

  // ── 파티클 ──
  function spawnParticles(x, y, emojis) {
    emojis.forEach((em, i) => {
      const el = document.createElement('div');
      el.className = 'particle';
      el.textContent = em;
      el.style.left = (x + (Math.random() - 0.5) * 70) + 'px';
      el.style.top  = y + 'px';
      el.style.animationDelay = (i * 0.09) + 's';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1500);
    });
  }

  // ── 말풍선 ──
  let bubbleTimer;
  function showBubble(text) {
    speechBubble.textContent = text;
    speechBubble.classList.add('visible');
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(() => speechBubble.classList.remove('visible'), 1900);
  }

  // ── 수면 ──
  function setSleeping(on) {
    state.sleeping = on;
    zzz.style.opacity = on ? '1' : '0';
    if (on) {
      eyeL.classList.add('sleeping');
      eyeR.classList.add('sleeping');
      showBubble('💤 쿨쿨...');
    } else {
      eyeL.classList.remove('sleeping');
      eyeR.classList.remove('sleeping');
      showBubble('😲 엇, 깼다!');
    }
    updateStatus();
  }

  function resetIdleTimer() {
    clearTimeout(state.idleTimer);
    if (state.sleeping) setSleeping(false);
    state.idleTimer = setTimeout(() => setSleeping(true), 12000);
  }
  resetIdleTimer();

  // ── SVG 애니메이션 재시작 헬퍼 ──
  function restartAnim(el, cls) {
    el.classList.remove(cls);
    el.getBoundingClientRect();
    el.classList.add(cls);
    el.addEventListener('animationend', () => el.classList.remove(cls), { once: true });
  }

  // ── A: 클릭 반응 ──
  pigContainer.addEventListener('click', () => {
    if (state.sleeping) { setSleeping(false); return; }
    resetIdleTimer();

    const rect = pigContainer.getBoundingClientRect();
    const cx = rect.left + rect.width  / 2;
    const cy = rect.top  + rect.height / 2;

    const oinks = ['꿀꿀!', '꿀~꿀!', '히히힝!', '꽤꽤!', '반가워!'];
    showBubble(oinks[Math.floor(Math.random() * oinks.length)]);
    spawnParticles(cx, cy - 40, ['🐷','💖','✨']);
    restartAnim(pigHead, 'bouncing');

    state.happy = Math.min(100, state.happy + 3);
    updateStatus();
  });

  // ── C: 마우스 눈 추적 ──
  function trackEye(eyeEl, pupilEl, mx, my) {
    const rect = eyeEl.getBoundingClientRect();
    const cx = rect.left + rect.width  / 2;
    const cy = rect.top  + rect.height / 2;
    const angle = Math.atan2(my - cy, mx - cx);
    const dist  = Math.min(Math.hypot(mx - cx, my - cy), 4.5);
    pupilEl.style.transform =
      `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist}px)`;
  }

  document.addEventListener('mousemove', (e) => {
    if (state.sleeping) return;
    trackEye(eyeL, pupilL, e.clientX, e.clientY);
    trackEye(eyeR, pupilR, e.clientX, e.clientY);
  });

  // ── D: 드래그 앤 드롭 ──
  const ghost = document.getElementById('drag-ghost');
  let draggingFood = null;

  document.querySelectorAll('.food-item').forEach(item => {
    item.addEventListener('dragstart', (e) => {
      draggingFood = item.dataset.food;
      item.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'copy';
      e.dataTransfer.setDragImage(new Image(), 0, 0);
      ghost.textContent = draggingFood;
      ghost.style.display = 'block';
    });
    item.addEventListener('dragend', () => {
      item.classList.remove('dragging');
      ghost.style.display = 'none';
      draggingFood = null;
    });
  });

  document.addEventListener('dragover', (e) => {
    e.preventDefault();
    ghost.style.left = e.clientX + 'px';
    ghost.style.top  = e.clientY + 'px';
  });

  pigContainer.addEventListener('dragover', (e) => {
    e.preventDefault();
    pigContainer.classList.add('dragover');
  });
  pigContainer.addEventListener('dragleave', () => {
    pigContainer.classList.remove('dragover');
  });
  pigContainer.addEventListener('drop', (e) => {
    e.preventDefault();
    pigContainer.classList.remove('dragover');
    if (!draggingFood) return;
    if (state.sleeping) setSleeping(false);
    resetIdleTimer();

    const rect = pigContainer.getBoundingClientRect();
    spawnParticles(rect.left + rect.width / 2, rect.top + 30, [draggingFood, '😋', '✨']);
    showBubble('냠냠~ 맛있어!');
    restartAnim(pigHead, 'wiggling');

    state.hunger = Math.min(100, state.hunger + 20);
    state.happy  = Math.min(100, state.happy  + 10);
    updateStatus();
  });

  // ── B: 쓰다듬기 버튼 ──
  document.getElementById('btnPet').addEventListener('click', () => {
    if (state.sleeping) { setSleeping(false); return; }
    resetIdleTimer();
    showBubble('기분 좋아~ 🩷');
    const r = pigContainer.getBoundingClientRect();
    spawnParticles(r.left + r.width / 2, r.top + 40, ['💕','🌸','✨','💗']);
    restartAnim(pigHead, 'wiggling');
    state.happy = Math.min(100, state.happy + 15);
    updateStatus();
  });

  // ── B: 먹이주기 버튼 ──
  document.getElementById('btnFeed').addEventListener('click', () => {
    if (state.sleeping) { setSleeping(false); return; }
    resetIdleTimer();
    const f = ['🍎','🥕','🌽'][Math.floor(Math.random() * 3)];
    const r = pigContainer.getBoundingClientRect();
    spawnParticles(r.left + r.width / 2, r.top + 40, [f, '😋', '💛']);
    showBubble('냠냠~ 맛있어!');
    restartAnim(pigHead, 'wiggling');
    state.hunger = Math.min(100, state.hunger + 20);
    state.happy  = Math.min(100, state.happy  + 5);
    updateStatus();
  });

  // ── B: 시간 경과 배고픔·행복 감소 ──
  setInterval(() => {
    if (!state.sleeping) {
      state.hunger = Math.max(0, state.hunger - 1.5);
      state.happy  = Math.max(0, state.happy  - 0.8);
    }
    updateStatus();
  }, 3000);

  updateStatus();
</script>
</body>
</html>
