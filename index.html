<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Tasks</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 아쿠아리움 배경 레이어 -->
  <div class="aquarium-bg" id="aquarium-bg" aria-hidden="true">
    <div class="aq-shimmer"></div>
    <div class="aq-creatures" id="aq-creatures"></div>
    <div class="aq-bubbles"  id="aq-bubbles"></div>
  </div>

  <div class="app">

    <!-- 사이드바: 헤더 + 대시보드 -->
    <aside class="sidebar">
      <header class="app-header">
        <h1>My<br>Tasks</h1>
        <div class="header-btns">
          <button id="calendar-toggle" class="calendar-toggle"
            aria-label="캘린더 열기/닫기 (Alt+C)" title="Alt+C">
            <span aria-hidden="true">📅</span>
          </button>
          <button id="theme-toggle" class="theme-toggle"
            aria-label="테마 전환 (Alt+D)" title="Alt+D">
            <span id="theme-icon" aria-hidden="true">🌙</span>
          </button>
        </div>
      </header>

      <section id="dashboard" class="dashboard"
        aria-label="할 일 진행률 통계"></section>

      <!-- 아기돼지 키우기 -->
      <div id="pig-section" class="pig-section" aria-label="아기돼지 키우기">
        <div class="pig-title-row">
          <span class="pig-label">🐷 아기돼지</span>
          <span id="pig-voucher-badge" class="pig-voucher-badge" hidden></span>
        </div>
        <div id="pig-display" class="pig-display" aria-hidden="true"></div>
        <p id="pig-bubble" class="pig-bubble"></p>
        <button id="pig-event-btn" class="pig-event-btn" disabled>선물권 사용하기 🎁</button>
      </div>
      <!-- 캘린더 -->
      <div id="calendar-section" class="calendar-section" hidden aria-label="캘린더">
        <div class="cal-header">
          <button id="cal-prev-btn" class="cal-nav-btn" aria-label="이전 달">‹</button>
          <span id="cal-month-label" class="cal-month-label"></span>
          <button id="cal-next-btn" class="cal-nav-btn" aria-label="다음 달">›</button>
          <button id="cal-today-btn" class="cal-today-btn">오늘</button>
        </div>
        <div class="cal-weekdays" aria-hidden="true">
          <span>일</span><span>월</span><span>화</span><span>수</span>
          <span>목</span><span>금</span><span>토</span>
        </div>
        <div id="cal-grid" class="cal-grid" role="grid" aria-label="날짜 선택"></div>
        <div id="cal-day-panel" class="cal-day-panel" hidden>
          <div class="cal-day-title-row">
            <span id="cal-day-title" class="cal-day-title"></span>
            <button id="cal-day-close" class="cal-day-close" aria-label="날짜 패널 닫기">✕</button>
          </div>
          <ul id="cal-day-list" class="cal-day-list" aria-label="선택한 날짜의 할 일"></ul>
          <p id="cal-day-empty" class="cal-day-empty" hidden>이 날에 할 일이 없습니다</p>
        </div>
      </div>

    </aside>

    <!-- 메인 패널 -->
    <main class="main-panel">

      <!-- 상단 컨트롤 (고정) -->
      <div class="main-controls">

        <div class="input-area" role="group" aria-label="새 할 일 추가">
          <label for="category-select" class="sr-only">카테고리 선택</label>
          <select id="category-select" aria-label="카테고리">
            <option value="업무">💼 업무</option>
            <option value="개인">🏠 개인</option>
            <option value="공부">📚 공부</option>
          </select>
          <label for="todo-input" class="sr-only">할 일 내용</label>
          <input type="text" id="todo-input"
            placeholder="할 일 입력... (Alt+N)"
            autocomplete="off"
            maxlength="500"
            aria-describedby="duplicate-warning">
          <label for="due-date-input" class="sr-only">마감일</label>
          <input type="date" id="due-date-input" class="due-date-input"
            aria-label="마감일 선택">
          <button id="add-btn" aria-label="할 일 추가">추가</button>
        </div>

        <p id="duplicate-warning" class="duplicate-warning"
          role="alert" aria-live="assertive" hidden>
          동일한 할 일이 이미 있습니다. 한 번 더 <strong>추가</strong>를 누르면 등록됩니다.
        </p>

        <div class="search-area" role="search">
          <label for="search-input" class="sr-only">할 일 검색</label>
          <input type="text" id="search-input"
            placeholder="🔍  검색..."
            autocomplete="off"
            aria-label="할 일 검색">
          <button id="search-clear" class="search-clear"
            aria-label="검색어 지우기" hidden>✕</button>
        </div>

        <div class="filter-bar" role="group" aria-label="카테고리 필터">
          <button class="filter-btn active" data-filter="전체"
            aria-pressed="true">전체</button>
          <button class="filter-btn" data-filter="업무"
            aria-pressed="false">💼 업무</button>
          <button class="filter-btn" data-filter="개인"
            aria-pressed="false">🏠 개인</button>
          <button class="filter-btn" data-filter="공부"
            aria-pressed="false">📚 공부</button>
          <button id="clear-completed-btn" class="clear-btn"
            aria-label="완료된 항목 모두 삭제">완료 삭제</button>
        </div>

        <div class="toolbar" role="toolbar" aria-label="목록 도구">
          <div class="sort-wrap">
            <label for="sort-select" class="toolbar-label">정렬</label>
            <select id="sort-select" aria-label="정렬 기준 선택">
              <option value="newest">최신순</option>
              <option value="oldest">오래된순</option>
              <option value="category">카테고리순</option>
              <option value="status">완료 상태순</option>
            </select>
          </div>
          <div class="io-wrap">
            <button id="export-btn" class="io-btn"
              aria-label="할 일 목록을 JSON 파일로 내보내기">⬆ 내보내기</button>
            <button id="import-btn" class="io-btn"
              aria-label="JSON 파일에서 할 일 가져오기">⬇ 가져오기</button>
            <input type="file" id="import-file"
              accept=".json" hidden aria-hidden="true">
          </div>
        </div>

      </div><!-- /main-controls -->

      <!-- 할 일 목록 (독립 스크롤) -->
      <div class="list-area">
        <ul id="todo-list" role="list" aria-label="할 일 목록"></ul>
        <p id="empty-msg" class="empty-msg"
          aria-live="polite">할 일이 없습니다. 추가해보세요!</p>
      </div>

    </main>
  </div>

  <!-- 아기돼지 이벤트 모달 -->
  <div id="pig-event-modal" class="modal-overlay"
    role="dialog" aria-modal="true" aria-labelledby="pig-event-title" hidden>
    <div class="modal-box pig-event-box">
      <div id="pig-event-anim" class="pig-event-anim" aria-hidden="true"></div>
      <h3 id="pig-event-title" class="pig-event-title"></h3>
      <p id="pig-event-desc" class="pig-event-desc"></p>
      <button id="pig-event-close-btn" class="modal-btn pig-event-close">완료! 🎉</button>
    </div>
  </div>

  <!-- 확인 모달 -->
  <div id="confirm-modal" class="modal-overlay"
    role="dialog" aria-modal="true" aria-labelledby="modal-msg" hidden>
    <div class="modal-box">
      <p id="modal-msg" class="modal-msg-text"></p>
      <div class="modal-actions">
        <button id="modal-cancel-btn" class="modal-btn modal-btn-cancel">취소</button>
        <button id="modal-confirm-btn" class="modal-btn modal-btn-danger">삭제</button>
      </div>
    </div>
  </div>

  <!-- 토스트 -->
  <div id="toast" class="toast"
    role="status" aria-live="polite" aria-atomic="true" hidden>
    <span id="toast-msg" class="toast-msg"></span>
    <button id="toast-action-btn" class="toast-action" hidden>되돌리기</button>
    <button id="toast-close-btn" class="toast-close" aria-label="알림 닫기">✕</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
